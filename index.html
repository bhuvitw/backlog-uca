<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Space — Live Sync</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top Navigation -->
  <nav class="nav">
    <div class="nav-brand">📝 Shared Backlog Workspace</div>
    
    <div class="user-auth">
      <!-- Active Users Counter -->
      <div id="active-users-badge" class="active-users-badge" title="Active users in last 30s">
        🟢 <span id="active-users-count">1</span> Active
        <div id="active-users-tooltip" class="active-users-tooltip">Active: You</div>
      </div>

      <span id="user-status">User: Anonymous</span>
      <input type="text" id="username-input" placeholder="Enter name..." />
      <button id="auth-btn">Set Name</button>
      <button id="sync-btn" title="Manual Sync">🔄 Syncing...</button>
    </div>
  </nav>

  <div class="workspace">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-title">NAVIGATION</div>
      <ul id="week-tabs" class="week-tabs">
        <!-- Rendered by JS -->
      </ul>

      <!-- New Week Controls -->
      <div class="add-week-box">
        <input type="text" id="new-week-input" placeholder="e.g. Week 7" />
        <button id="add-week-btn" class="add-btn">+ Add Week</button>
      </div>
    </aside>

    <!-- Main Canvas -->
    <main class="document">
      <div class="doc-header">
        <div class="doc-title-group">
          <h1 id="current-week-title">Loading...</h1>
          <button id="delete-week-btn" class="icon-btn delete-week-btn" title="Delete current week">🗑️ Delete Week</button>
        </div>
        <button id="add-topic-btn" class="add-btn">+ Add Main Topic</button>
      </div>

      <!-- Topics Container / Summary Container -->
      <div id="topic-container" class="topic-container">
        <!-- Rendered by JS -->
      </div>
    </main>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
