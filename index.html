<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Backlog Workspace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation matching your current screenshot -->
  <nav class="nav">
    <div class="nav-brand">📋 Shared Backlog Workspace</div>
    <div class="user-auth">
      <a href="notes.html" class="nav-link">📝 Personal Notes</a>
      <span id="user-status">User: anonymous</span>
      <div id="active-users-badge" class="active-users-badge">
        <span id="active-users-count">1</span>
        <span id="active-users-tooltip" class="active-users-tooltip">Active: anonymous</span>
      </div>
      <input type="text" id="username-input" placeholder="Enter name..." />
      <button id="auth-btn">Set Name</button>
      <button id="sync-btn" class="icon-btn">🟢 Live</button>
    </div>
  </nav>

  <div class="workspace">
    <!-- Left Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-title">NAVIGATION</div>
      <ul id="week-tabs" class="week-tabs"></ul>
      <div class="add-week-box">
        <input type="text" id="new-week-input" placeholder="e.g. Week 7" />
        <button id="add-week-btn" class="add-btn">+ Add Week</button>
      </div>
    </aside>

    <!-- Middle Main Canvas -->
    <main class="document">
      <div class="doc-header">
        <div class="doc-title-group">
          <h1 id="current-week-title">Loading...</h1>
          <button id="delete-week-btn" class="icon-btn delete-week-btn">🗑️ Delete Week</button>
        </div>
        <button id="add-topic-btn" class="add-btn">+ Add Main Topic</button>
      </div>
      <div id="topic-container" class="topic-container"></div>
    </main>

    <!-- Right Discussion Panel from your Wireframe -->
    <aside class="discussion-panel" id="discussion-panel">
      <div class="discuss-header">
        <h3>💬 <span id="discuss-week-label">Week 1</span></h3>
        <button id="close-discuss-btn" class="icon-btn mobile-only">✖</button>
      </div>
      <div class="discuss-messages" id="discuss-messages">
        <!-- Chat bubbles go here -->
      </div>
      <div class="discuss-input-area">
        <input type="text" id="week-discuss-input" placeholder="Type a message..." />
        <button id="post-week-comment-btn" class="add-btn">Post</button>
      </div>
    </aside>

    <!-- Mobile Floating Button -->
    <button id="mobile-discuss-toggle" class="mobile-floating-btn">💬 Discussion</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
